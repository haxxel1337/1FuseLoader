name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the target Home Assistant and Easee library
        run: python -m pip install homeassistant==2026.10.1 pyeasee==0.8.17

      - name: Compile Python files
        run: python -m compileall -q custom_components/1fuseloader test_1fuseloader_*.py

      - name: Run safety, configuration, adapter and real HA smoke tests
        env:
          ONEFUSE_REQUIRE_HOMEASSISTANT: "1"
          ONEFUSE_REQUIRE_PYEASEE_CONTRACT: "1"
        run: |
          for test_script in test_1fuseloader_*.py; do
            python "$test_script"
          done
