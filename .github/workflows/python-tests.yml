name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-logic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2026.10.1", "2026.10.2"]
        pyeasee: ["0.8.17", "0.8.19"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the target Home Assistant, Easee and MQTT libraries
        run: python -m pip install homeassistant==${{ matrix.homeassistant }} pyeasee==${{ matrix.pyeasee }} paho-mqtt==2.1.0

      - name: Compile Python files
        run: python -m compileall -q custom_components/1fuseloader test_1fuseloader_*.py

      - name: Run safety, configuration, adapter and real HA smoke tests
        env:
          ONEFUSE_REQUIRE_HOMEASSISTANT: "1"
          ONEFUSE_REQUIRE_PYEASEE_CONTRACT: "1"
        run: |
          result=0
          for test_script in test_1fuseloader_*.py; do
            if ! python "$test_script"; then
              result=1
            fi
          done
          exit "$result"
